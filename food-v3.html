<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>식당 · 카페 가이드</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Apple SD Gothic Neo",
        "Noto Sans KR",
        sans-serif;
      background: #f6efe7;
      color: #332c29;
    }

    .wrap {
      width: min(100% - 24px, 680px);
      margin: 0 auto;
      padding: 18px 0 40px;
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 14px;
    }

    .back {
      text-decoration: none;
      color: #9a5c43;
      font-size: 14px;
      font-weight: 800;
    }

    .sync {
      font-size: 11px;
      font-weight: 700;
      color: #8f7c70;
      text-align: right;
    }

    .sync[data-ok="1"] {
      color: #66805c;
    }

    .sync[data-ok="0"] {
      color: #a85445;
    }

    .hero {
      background:
        linear-gradient(
          135deg,
          rgba(255, 253, 248, 0.97),
          rgba(248, 230, 214, 0.98)
        );
      border: 1px solid #e6d2c1;
      border-radius: 24px;
      padding: 22px 20px;
      box-shadow: 0 8px 22px rgba(72, 49, 35, 0.09);
      margin-bottom: 14px;
    }

    .hero h1 {
      margin: 0 0 7px;
      font-size: 25px;
      line-height: 1.25;
    }

    .hero p {
      margin: 0;
      color: #806f65;
      font-size: 13px;
      line-height: 1.55;
    }

    .section {
      background: rgba(255, 253, 249, 0.98);
      border: 1px solid #e9d8ca;
      border-radius: 20px;
      padding: 16px;
      margin-top: 12px;
      box-shadow: 0 6px 16px rgba(72, 49, 35, 0.06);
    }

    .section-title {
      font-size: 16px;
      font-weight: 850;
      margin-bottom: 11px;
    }

    .food-list {
      display: grid;
      gap: 7px;
    }

    .food-item {
      display: flex;
      align-items: center;
      gap: 9px;
      min-height: 43px;
      padding: 9px 10px;
      border-radius: 13px;
      background: #faf5ef;
      border: 1px solid #eee0d4;
      cursor: pointer;
    }

    .food-item input {
      width: 18px;
      height: 18px;
      accent-color: #b86b4d;
      flex: 0 0 auto;
    }

    .food-item span {
      flex: 1;
      font-size: 14px;
      line-height: 1.4;
    }

    .food-item:has(input:checked) span {
      text-decoration: line-through;
      opacity: 0.55;
    }

    .x {
      border: 0;
      background: transparent;
      color: #b09b8f;
      font-size: 21px;
      cursor: pointer;
      padding: 0 4px;
    }

    .add-row {
      display: flex;
      gap: 7px;
      margin-top: 10px;
    }

    input,
    select,
    textarea,
    button {
      font: inherit;
    }

    input,
    select,
    textarea {
      width: 100%;
      border: 1px solid #dfcec1;
      background: #fffdfa;
      color: #332c29;
      border-radius: 12px;
      padding: 11px 12px;
      outline: none;
    }

    input:focus,
    select:focus,
    textarea:focus {
      border-color: #ba765c;
      box-shadow: 0 0 0 3px rgba(186, 118, 92, 0.12);
    }

    textarea {
      resize: vertical;
      min-height: 76px;
      margin-top: 7px;
    }

    .primary-btn,
    .add-btn {
      border: 0;
      background: #a85f43;
      color: white;
      font-weight: 800;
      border-radius: 12px;
      cursor: pointer;
    }

    .primary-btn {
      flex: 0 0 auto;
      padding: 0 15px;
    }

    .regions-title {
      margin: 18px 2px 8px;
      font-size: 17px;
      font-weight: 900;
    }

    .region {
      overflow: hidden;
      border: 1px solid #e5d4c6;
      border-radius: 20px;
      background: #fffdf9;
      margin-top: 10px;
      box-shadow: 0 5px 15px rgba(72, 49, 35, 0.055);
    }

    .region-head {
      padding: 14px 15px;
      font-size: 16px;
      font-weight: 900;
      background: linear-gradient(135deg, #f8eadf, #f4dfd0);
      border-bottom: 1px solid #ead7c8;
    }

    .list {
      padding: 10px 12px 0;
    }

    .place {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 9px;
      padding: 11px 2px;
      border-bottom: 1px dashed #eadfd7;
    }

    .place:last-child {
      border-bottom: none;
    }

    .name {
      font-size: 14px;
      font-weight: 850;
      line-height: 1.4;
    }

    .meta {
      margin-top: 3px;
      color: #85736a;
      font-size: 12px;
      line-height: 1.5;
      white-space: pre-wrap;
    }

    .actions {
      display: flex;
      gap: 5px;
      flex: 0 0 auto;
    }

    .actions a,
    .actions button {
      border: 1px solid #dfcec1;
      background: #faf5ef;
      color: #8c5c48;
      border-radius: 9px;
      padding: 6px 8px;
      text-decoration: none;
      font-size: 11px;
      font-weight: 800;
      cursor: pointer;
    }

    .form {
      margin: 6px 12px 12px;
      padding: 12px;
      border-radius: 15px;
      background: #faf5ef;
      border: 1px solid #eee0d5;
    }

    .form-row {
      display: grid;
      grid-template-columns: minmax(0, 1.4fr) minmax(95px, 0.7fr);
      gap: 7px;
    }

    .add-btn {
      width: 100%;
      padding: 11px 12px;
      margin-top: 8px;
    }

    .empty {
      color: #a08d82;
      font-size: 12px;
      padding: 8px 2px 12px;
    }

    @media (max-width: 440px) {
      .wrap {
        width: min(100% - 18px, 680px);
      }

      .hero {
        padding: 19px 17px;
      }

      .hero h1 {
        font-size: 23px;
      }

      .form-row {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

<body>
  <main class="wrap">
    <div class="topbar">
      <a class="back" href="index.html">← 여행 일정</a>
      <div id="syncStatus" class="sync">연결 확인 중...</div>
    </div>

    <section class="hero">
      <h1>🍽️ 식당 · 카페 가이드</h1>
      <p>
        먹고 싶은 메뉴와 지역별 식당 · 카페를 가족과 함께 저장해두는 페이지
      </p>
    </section>

    <section class="section">
      <div class="section-title">먹어볼 것</div>

      <div id="foodList" class="food-list"></div>

      <div class="add-row">
        <input
          id="newFood"
          type="text"
          placeholder="먹고 싶은 음식 추가"
          autocomplete="off"
        />
        <button
          type="button"
          class="primary-btn"
          onclick="addFood()"
        >
          추가
        </button>
      </div>
    </section>

    <div class="regions-title">지역별 식당 · 카페</div>
    <div id="regions"></div>
  </main>

  <script src="config.js"></script>

  <script>
    const cfg = window.TRIP_CONFIG || {};

    const API =
      (cfg.SUPABASE_URL || "").trim().replace(/\/+$/, "") +
      "/rest/v1";

    const APIKEY =
      (cfg.SUPABASE_KEY || "").trim();

    const isConfigured =
      Boolean(cfg.SUPABASE_URL) &&
      Boolean(APIKEY) &&
      !cfg.SUPABASE_URL.includes("PASTE_") &&
      !APIKEY.includes("PASTE_");

    function setSyncStatus(text, ok = true) {
      const el = document.getElementById("syncStatus");

      if (!el) return;

      el.textContent = text;
      el.dataset.ok = ok ? "1" : "0";
    }

    async function api(path, opts = {}) {
      const method = opts.method || "GET";

      const headers = {
        apikey: APIKEY,
        "Content-Type": "application/json",
        ...(opts.headers || {})
      };

      if (
        method === "POST" ||
        method === "PATCH" ||
        method === "DELETE"
      ) {
        headers.Prefer =
          opts.prefer || "return=minimal";
      }

      const res = await fetch(API + path, {
        method,
        headers,
        body: opts.body
      });

      if (!res.ok) {
        const text = await res.text();

        console.error(
          "Supabase API 오류",
          res.status,
          text
        );

        throw new Error(
          text || `HTTP ${res.status}`
        );
      }

      if (res.status === 204) {
        return null;
      }

      const text = await res.text();

      return text
        ? JSON.parse(text)
        : null;
    }

    const REGIONS = [
      ["newcity", "이스탄불 신시가지"],
      ["oldcity", "이스탄불 구시가지"],
      ["asia", "이스탄불 아시아지구"],
      ["cappadocia", "카파도키아"],
      ["antalya", "안탈리아"],
      ["pamukkale", "파묵칼레"]
    ];

    const defaultFoods = [
      "현지식 아침 · 카흐발트",
      "쾨프테",
      "케밥",
      "카이막",
      "와인",
      "바클라바",
      "베이란",
      "고등어케밥"
    ];

    const seedPlaces = [
      {
        region: "newcity",
        name: "고등어케밥",
        type: "먹을 것",
        note: "이스탄불 신시가지에서 먹어보기",
        link: ""
      },
      {
        region: "newcity",
        name: "바클라바",
        type: "디저트",
        note: "디저트 후보",
        link: ""
      },
      {
        region: "asia",
        name: "베이란",
        type: "먹을 것",
        note: "양고기국밥",
        link: ""
      }
    ];

    let foods = [];
    let places = [];

    function esc(value) {
      return String(value || "").replace(
        /[&<>"']/g,
        char =>
          ({
            "&": "&amp;",
            "<": "&lt;",
            ">": "&gt;",
            '"': "&quot;",
            "'": "&#039;"
          })[char]
      );
    }

    function linkify(value) {
      const url = String(value || "").trim();

      if (!url) return "";

      if (/^https?:\/\//i.test(url)) {
        return url;
      }

      return "https://" + url;
    }

    function persistLocal() {
      localStorage.setItem(
        "shared_foods",
        JSON.stringify(foods)
      );

      localStorage.setItem(
        "shared_places",
        JSON.stringify(places)
      );
    }

    async function loadAll(showStatus = true) {
      if (!isConfigured) {
        setSyncStatus(
          "로컬 모드 · Supabase 설정 필요",
          false
        );

        foods =
          JSON.parse(
            localStorage.getItem("shared_foods") ||
              "null"
          ) ||
          defaultFoods.map((name, i) => ({
            id: "local-food-" + i,
            name,
            checked: false
          }));

        places =
          JSON.parse(
            localStorage.getItem("shared_places") ||
              "null"
          ) ||
          seedPlaces.map((place, i) => ({
            id: "local-place-" + i,
            ...place
          }));

        renderAll();

        return;
      }

      try {
        const [foodData, placeData] =
          await Promise.all([
            api(
              "/food_items?select=*&order=created_at.asc"
            ),
            api(
              "/places?select=*&order=created_at.asc"
            )
          ]);

        foods = foodData || [];
        places = placeData || [];

        renderAll();

        if (showStatus) {
          setSyncStatus(
            "Supabase 연결됨 · 가족 공동 편집",
            true
          );
        }
      } catch (error) {
        console.error(error);

        setSyncStatus(
          "DB 오류: " + error.message,
          false
        );
      }
    }

    function renderAll() {
      renderFoods();
      renderRegions();
    }

    function renderFoods() {
      const root =
        document.getElementById("foodList");

      root.innerHTML = "";

      foods.forEach(food => {
        const row =
          document.createElement("label");

        row.className = "food-item";

        row.innerHTML = `
          <input
            type="checkbox"
            ${food.checked ? "checked" : ""}
          >
          <span>${esc(food.name)}</span>
          <button
            type="button"
            class="x"
            aria-label="삭제"
          >
            ×
          </button>
        `;

        row.querySelector("input").onchange =
          event => {
            toggleFood(
              food,
              event.target.checked
            );
          };

        row.querySelector("button").onclick =
          event => {
            event.preventDefault();
            event.stopPropagation();

            deleteFood(food);
          };

        root.appendChild(row);
      });
    }

    async function addFood() {
      const input =
        document.getElementById("newFood");

      const name = input.value.trim();

      if (!name) {
        input.focus();
        return;
      }

      try {
        setSyncStatus("저장 중...", true);

        if (isConfigured) {
          await api("/food_items", {
            method: "POST",
            body: JSON.stringify({
              name,
              checked: false
            })
          });
        } else {
          foods.push({
            id: "local-food-" + Date.now(),
            name,
            checked: false
          });

          persistLocal();
        }

        input.value = "";

        await loadAll(false);

        setSyncStatus("저장 완료 ✓", true);

        resetStatusLater();
      } catch (error) {
        console.error(
          "음식 추가 오류",
          error
        );

        setSyncStatus(
          "저장 실패",
          false
        );

        alert(
          "추가하지 못했습니다.\n\n" +
            error.message
        );
      }
    }

    async function toggleFood(
      food,
      checked
    ) {
      try {
        if (isConfigured) {
          await api(
            "/food_items?id=eq." +
              encodeURIComponent(food.id),
            {
              method: "PATCH",
              body: JSON.stringify({
                checked
              })
            }
          );
        } else {
          food.checked = checked;
          persistLocal();
        }

        await loadAll(false);
      } catch (error) {
        console.error(
          "체크 저장 오류",
          error
        );

        alert(
          "변경사항을 저장하지 못했습니다.\n\n" +
            error.message
        );

        await loadAll(false);
      }
    }

    async function deleteFood(food) {
      try {
        if (isConfigured) {
          await api(
            "/food_items?id=eq." +
              encodeURIComponent(food.id),
            {
              method: "DELETE"
            }
          );
        } else {
          foods = foods.filter(
            item => item.id !== food.id
          );

          persistLocal();
        }

        await loadAll(false);
      } catch (error) {
        console.error(
          "음식 삭제 오류",
          error
        );

        alert(
          "삭제하지 못했습니다.\n\n" +
            error.message
        );
      }
    }

    function renderRegions() {
      const root =
        document.getElementById("regions");

      root.innerHTML = "";

      REGIONS.forEach(
        ([regionId, regionLabel]) => {
          const regionPlaces =
            places.filter(
              place =>
                place.region === regionId
            );

          const section =
            document.createElement("section");

          section.className = "region";

          section.id = regionId;

          section.innerHTML = `
            <div class="region-head">
              ${esc(regionLabel)}
            </div>

            <div
              class="list"
              id="list-${regionId}"
            ></div>

            <div class="form">
              <div class="form-row">
                <input
                  id="name-${regionId}"
                  type="text"
                  placeholder="식당 / 카페 이름"
                  autocomplete="off"
                >

                <select
                  id="type-${regionId}"
                >
                  <option>식당</option>
                  <option>카페</option>
                  <option>디저트</option>
                  <option>와인</option>
                  <option>먹을 것</option>
                </select>
              </div>

              <textarea
                id="note-${regionId}"
                placeholder="메뉴, 가격, 영업시간, 메모 등"
              ></textarea>

              <input
                id="link-${regionId}"
                type="text"
                placeholder="지도 / 블로그 링크 (선택)"
                autocomplete="off"
                style="margin-top:7px"
              >

              <button
                type="button"
                class="add-btn"
                onclick="addPlace('${regionId}', this)"
              >
                ＋ 이 지역에 추가
              </button>
            </div>
          `;

          root.appendChild(section);

          const list =
            document.getElementById(
              "list-" + regionId
            );

          if (!regionPlaces.length) {
            list.innerHTML = `
              <div class="empty">
                아직 저장한 곳이 없어요.
              </div>
            `;
          }

          regionPlaces.forEach(place => {
            const row =
              document.createElement("div");

            row.className = "place";

            const url =
              linkify(place.link);

            row.innerHTML = `
              <div>
                <div class="name">
                  ${esc(place.name)}
                </div>

                <div class="meta">
                  ${esc(place.type)}
                  ${
                    place.note
                      ? " · " +
                        esc(place.note)
                      : ""
                  }
                </div>
              </div>

              <div class="actions">
                ${
                  url
                    ? `
                    <a
                      href="${esc(url)}"
                      target="_blank"
                      rel="noopener noreferrer"
                    >
                      링크
                    </a>
                  `
                    : ""
                }

                <button
                  type="button"
                >
                  삭제
                </button>
              </div>
            `;

            row.querySelector(
              "button"
            ).onclick = () =>
              deletePlace(place);

            list.appendChild(row);
          });
        }
      );
    }

    async function addPlace(
      region,
      button
    ) {
      const nameInput =
        document.getElementById(
          "name-" + region
        );

      const typeInput =
        document.getElementById(
          "type-" + region
        );

      const noteInput =
        document.getElementById(
          "note-" + region
        );

      const linkInput =
        document.getElementById(
          "link-" + region
        );

      const name =
        nameInput.value.trim();

      if (!name) {
        alert(
          "식당 / 카페 이름을 입력해 주세요."
        );

        nameInput.focus();

        return;
      }

      const item = {
        region,
        name,
        type: typeInput.value,
        note: noteInput.value.trim(),
        link: linkInput.value.trim()
      };

      const originalText =
        button?.textContent || "";

      try {
        if (button) {
          button.disabled = true;
          button.textContent =
            "저장 중...";
        }

        setSyncStatus(
          "저장 중...",
          true
        );

        if (isConfigured) {
          await api("/places", {
            method: "POST",
            body: JSON.stringify(item)
          });
        } else {
          places.push({
            id:
              "local-place-" +
              Date.now(),
            ...item
          });

          persistLocal();
        }

        nameInput.value = "";
        noteInput.value = "";
        linkInput.value = "";

        await loadAll(false);

        setSyncStatus(
          "저장 완료 ✓",
          true
        );

        resetStatusLater();
      } catch (error) {
        console.error(
          "식당 추가 오류",
          error
        );

        setSyncStatus(
          "저장 실패",
          false
        );

        alert(
          "식당 / 카페를 추가하지 못했습니다.\n\n" +
            error.message
        );
      } finally {
        if (button) {
          button.disabled = false;
          button.textContent =
            originalText ||
            "＋ 이 지역에 추가";
        }
      }
    }

    async function deletePlace(place) {
      try {
        if (isConfigured) {
          await api(
            "/places?id=eq." +
              encodeURIComponent(
                place.id
              ),
            {
              method: "DELETE"
            }
          );
        } else {
          places =
            places.filter(
              item =>
                item.id !== place.id
            );

          persistLocal();
        }

        await loadAll(false);
      } catch (error) {
        console.error(
          "식당 삭제 오류",
          error
        );

        alert(
          "삭제하지 못했습니다.\n\n" +
            error.message
        );
      }
    }

    let statusTimer = null;

    function resetStatusLater() {
      clearTimeout(statusTimer);

      statusTimer = setTimeout(() => {
        if (isConfigured) {
          setSyncStatus(
            "Supabase 연결됨 · 가족 공동 편집",
            true
          );
        }
      }, 1200);
    }

    document
      .getElementById("newFood")
      .addEventListener(
        "keydown",
        event => {
          if (event.key === "Enter") {
            event.preventDefault();
            addFood();
          }
        }
      );

    loadAll();

    setInterval(() => {
      if (isConfigured) {
        loadAll(false);
      }
    }, 5000);
  </script>
</body>
</html>
